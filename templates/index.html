<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deliver-It</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- ====== App Header ====== -->
<header class="app-header">
  <div style="display:flex;align-items:center;gap:.5rem">
    <span style="font-size:1.3rem">📦</span>
    <h1>Deliver-It <span class="subtitle">powered by Track-POD</span></h1>
  </div>
  <div class="header-actions">
    <span class="badge badge-new" id="new-count-badge" style="display:none;gap:.35rem">
      <span class="dot-new"></span>
      <span id="new-count-label"></span>
    </span>
    <button class="btn btn-outline btn-sm" id="refresh-btn" style="color:#fff;border-color:rgba(255,255,255,.4)">
      ↻ Refresh
    </button>
    <button class="btn btn-outline btn-sm" id="delivery-check-btn"
            style="color:#fff;border-color:rgba(255,255,255,.4)">
      📍 Check Delivery
    </button>
    <button class="btn btn-outline btn-sm" id="availability-btn"
            style="color:#fff;border-color:rgba(255,255,255,.4)">
      🗓 Availability
    </button>
    <button class="btn btn-primary btn-sm" id="new-order-btn"
            style="background:#fff;color:var(--brand)">
      + New Order
    </button>
  </div>
</header>

<!-- ====== Main Content ====== -->
<main class="container">

  <!-- Date navigation + filters -->
  <div class="card" style="margin-bottom:1.25rem">
    <div class="filters">
      <div class="filter-group">
        <label>View</label>
        <select id="filter-mode" style="min-width:110px">
          <option value="day">Single day</option>
          <option value="range">Date range</option>
        </select>
      </div>
      <div class="filter-group" id="filter-day-wrap">
        <label for="filter-date">Date</label>
        <input type="date" id="filter-date">
      </div>
      <div class="filter-group" id="filter-range-from-wrap" style="display:none">
        <label for="filter-from">From</label>
        <input type="date" id="filter-from">
      </div>
      <div class="filter-group" id="filter-range-to-wrap" style="display:none">
        <label for="filter-to">To</label>
        <input type="date" id="filter-to">
      </div>
      <div class="filter-group">
        <label for="filter-status">Status</label>
        <select id="filter-status" style="min-width:120px">
          <option value="all">All statuses</option>
          <option value="unassigned">Unassigned</option>
          <option value="progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="failed">Failed</option>
        </select>
      </div>
      <div class="filter-nav">
        <button class="btn btn-ghost btn-sm" id="prev-day" title="Previous day">←</button>
        <button class="btn btn-ghost btn-sm" id="today-btn">Today</button>
        <button class="btn btn-ghost btn-sm" id="next-day" title="Next day">→</button>
        <button class="btn btn-primary btn-sm" id="apply-filters">Load</button>
      </div>
    </div>
  </div>

  <!-- Orders Table -->
  <div class="card">
    <div class="card-header">
      <h2>Orders <span id="orders-date-label" style="font-weight:400;color:var(--text-muted);font-size:.8rem"></span></h2>
      <div style="display:flex;align-items:center;gap:.75rem">
        <p style="font-size:.72rem;color:var(--text-muted)">
          Orders marked <strong style="color:var(--new-badge)">New</strong> originated in
          Track-POD and have not yet been viewed here — click to action.
        </p>
        <button class="btn btn-outline btn-sm" id="new-route-btn" style="white-space:nowrap">+ New Route</button>
      </div>
    </div>
    <div class="orders-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:18px"></th>
            <th>Order #</th>
            <th>Client</th>
            <th>Address</th>
            <th>Date</th>
            <th>Status</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <tr>
            <td colspan="7">
              <div class="state-msg">
                <div class="spinner"></div>
                <div>Loading orders from Track-POD…</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div id="orders-empty" class="state-msg" style="display:none">
      <div class="icon">📭</div>
      <div>No orders found for this date.</div>
    </div>
  </div>

</main>

<!-- ====== Slide-over panel ====== -->
<div class="overlay" id="overlay">
  <div class="slide-panel" role="dialog" aria-modal="true">
    <div class="panel-header" id="panel-header"></div>
    <div class="panel-body"   id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>
</div>

<!-- ====== Toast container ====== -->
<div id="toast"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
